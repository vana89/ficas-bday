name: Enable shared planner sync
on:
  push:
    paths:
      - '.github/workflows/enable-shared-sync.yml'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add shared sync script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="sync.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
          s=s.replace('Promene se automatski čuvaju u browseru.','Promene se automatski čuvaju i dele sa svima koji imaju link.')
          s=s.replace('Fićin b-day planner • podaci se čuvaju lokalno u browseru','Fićin b-day planner • zajednički podaci se sinhronizuju online')
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Connect planner to shared Supabase data"
          git push
